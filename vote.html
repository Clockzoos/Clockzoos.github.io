<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA Channel Auto Reaction</title>
    <style>
        :root {
            --bg-color: #0b141a;
            --panel-color: #111b21;
            --input-color: #202c33;
            --text-color: #e9edef;
            --text-muted: #8696a0;
            --accent-color: #00a884;
            --accent-hover: #008f6f;
            --danger-color: #f15c6d;
            --warning-color: #ffb84d;
            --border-color: #2a3942;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--panel-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-color);
        }

        .header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
            color: #ffffff;
        }

        .header p {
            margin: 6px 0 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #aebac1;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .emoji-presets {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .emoji-btn {
            background: var(--input-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .emoji-btn:hover {
            border-color: var(--accent-color);
            transform: scale(1.08);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0b141a;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button.submit-btn:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #2a3942;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .response-box {
            margin-top: 20px;
            background: #080f14;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            font-family: monospace;
            font-size: 13px;
            color: #00a884;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
        }

        /* Toast Notification */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 260px;
            max-width: 360px;
            background: #202c33;
            color: #fff;
            padding: 14px 16px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            border-left: 4px solid var(--accent-color);
            animation: slideIn 0.25s ease forwards;
        }

        .toast.error { border-left-color: var(--danger-color); }
        .toast.warning { border-left-color: var(--warning-color); }

        @keyframes slideIn {
            from { transform: translateX(110%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="container">
        <div class="header">
            <h2>WA Channel Reactor</h2>
            <p>Kirim reaksi emoji otomatis ke postingan saluran WhatsApp.</p>
        </div>

        <div class="form-group">
            <label>API Key (NexaDev)</label>
            <input type="password" id="apiKey" placeholder="Masukkan API Key milikmu...">
        </div>

        <div class="form-group">
            <label>Link Postingan Saluran WhatsApp</label>
            <input type="text" id="channelUrl" placeholder="https://whatsapp.com/channel/...">
        </div>

        <div class="form-group">
            <label>Emoji Reaksi</label>
            <input type="text" id="reactionEmoji" placeholder="Contoh: 👍 atau ❤️">
            <div class="emoji-presets">
                <button type="button" class="emoji-btn" onclick="setEmoji('👍')">👍</button>
                <button type="button" class="emoji-btn" onclick="setEmoji('❤️')">❤️</button>
                <button type="button" class="emoji-btn" onclick="setEmoji('😂')">😂</button>
                <button type="button" class="emoji-btn" onclick="setEmoji('😮')">😮</button>
                <button type="button" class="emoji-btn" onclick="setEmoji('😢')">😢</button>
                <button type="button" class="emoji-btn" onclick="setEmoji('🙏')">🙏</button>
                <button type="button" class="emoji-btn" onclick="setEmoji('🔥')">🔥</button>
            </div>
        </div>

        <button class="submit-btn" id="sendBtn" onclick="sendReaction()">Kirim Reaction</button>

        <div class="response-box" id="responseBox"></div>
    </div>

    <script>
        function setEmoji(emoji) {
            document.getElementById('reactionEmoji').value = emoji;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3500);
        }

        async function sendReaction() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const channelUrl = document.getElementById('channelUrl').value.trim();
            const reaction = document.getElementById('reactionEmoji').value.trim();
            const sendBtn = document.getElementById('sendBtn');
            const responseBox = document.getElementById('responseBox');

            if (!apiKey) {
                showToast('API Key wajib diisi!', 'error');
                return;
            }
            if (!channelUrl) {
                showToast('Link postingan saluran wajib diisi!', 'error');
                return;
            }
            if (!reaction) {
                showToast('Pilih atau ketik emoji reaksi terlebih dahulu!', 'warning');
                return;
            }

            // Encode parameter agar aman dikirim lewat URL
            const endpoint = `https://api.nexadev.my.id/api/rch?key=${encodeURIComponent(apiKey)}&url=${encodeURIComponent(channelUrl)}&reaction=${encodeURIComponent(reaction)}`;

            sendBtn.disabled = true;
            sendBtn.textContent = 'Memproses...';
            responseBox.style.display = 'none';

            try {
                const response = await fetch(endpoint);
                const data = await response.json();

                responseBox.style.display = 'block';
                responseBox.textContent = JSON.stringify(data, null, 2);

                if (response.ok && (data.status === true || data.success === true || response.status === 200)) {
                    showToast('Permintaan berhasil dikirim ke server API!', 'success');
                } else {
                    showToast(data.message || 'Gagal memproses permintaan API.', 'error');
                }
            } catch (error) {
                responseBox.style.display = 'block';
                responseBox.style.color = '#f15c6d';
                responseBox.textContent = `Error: ${error.message}\n\nCatatan: Jika muncul "Failed to fetch", server API memblokir akses langsung dari browser (CORS) dan harus dijalankan lewat backend/Node.js.`;
                showToast('Terjadi kesalahan koneksi atau blokir CORS.', 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Kirim Reaction';
            }
        }
    </script>
</body>
</html>
