<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Spammers</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co.com/RpdnZ1mZ/icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b090a;
            --panel-color: #161214;
            --input-color: #080607;
            --text-color: #f3e8ea;
            --text-muted: #9e8a8d;
            --accent-color: #dc2626;
            --accent-hover: #b91c1c;
            --accent-glow: rgba(220, 38, 38, 0.35);
            --border-color: #2c1d20;
            --success-color: #16a34a;
            --warning-color: #eab308;
            --pixel-display: 'Press Start 2P', monospace;
            --pixel-body: 'VT323', monospace;
        }

        body {
            font-family: var(--pixel-body);
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top center, #260c0e 0%, #0b090a 65%);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            letter-spacing: 0.5px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--panel-color);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(220, 38, 38, 0.08);
            border: 1px solid var(--border-color);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-brand img {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 14px var(--accent-glow);
        }

        .header-brand h2 {
            font-family: var(--pixel-display);
            margin: 0;
            color: #ffffff;
            font-size: 18px;
            line-height: 1.5;
            letter-spacing: 0.5px;
        }

        .header-brand p {
            font-family: var(--pixel-body);
            margin: 6px 0 0 0;
            color: var(--text-muted);
            font-size: 18px;
        }

        .section-title {
            font-family: var(--pixel-display);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            font-weight: 700;
            margin: 24px 0 12px 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            font-family: var(--pixel-body);
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 18px;
            color: #d6c3c6;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            font-family: var(--pixel-body);
            width: 100%;
            padding: 11px 14px;
            background: var(--input-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 19px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.2);
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .media-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-btn {
            font-family: var(--pixel-body);
            background: #24171a;
            color: #f3e8ea;
            border: 1px solid var(--border-color);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            margin-bottom: 0;
            text-transform: none;
        }

        .file-btn:hover {
            border-color: var(--accent-color);
            background: #331c20;
        }

        input[type="file"] {
            display: none;
        }

        .file-name {
            font-family: var(--pixel-body);
            font-size: 17px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .clear-file-btn {
            font-family: var(--pixel-body);
            background: transparent;
            color: #f87171;
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 6px;
        }

        .clear-file-btn:hover {
            color: #ef4444;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--input-color);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; }

        .color-hex-text {
            font-family: var(--pixel-body) !important;
            font-size: 19px !important;
            color: var(--text-color);
            background: none !important;
            border: none !important;
            padding: 4px !important;
            width: 100%;
        }
        .color-hex-text:focus { outline: none; box-shadow: none !important; }

        button.send-btn {
            font-family: var(--pixel-display);
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 18px;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        button.send-btn:hover {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.5);
        }

        button.send-btn:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #3a2a2d !important;
            color: #7d686c !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            font-family: var(--pixel-body);
            min-width: 280px;
            max-width: 380px;
            background: #1a1214;
            color: #fff;
            padding: 14px 18px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 19px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            border-left: 5px solid var(--accent-color);
        }

        .toast.success { border-left-color: var(--success-color); }
        .toast.error { border-left-color: var(--accent-color); }
        .toast.warning { border-left-color: var(--warning-color); }

        @keyframes slideIn {
            from { transform: translateX(110%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(110%); opacity: 0; }
        }

        @media (max-width: 600px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
            .header-brand h2 {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="container">
        <div class="header-brand">
            <img src="https://i.ibb.co.com/RpdnZ1mZ/icon.jpg" alt="Bot Spammers Icon">
            <div>
                <h2>Bot Spammers</h2>
                <p>Send custom messages, GIFs, and embeds via Discord Webhooks.</p>
            </div>
        </div>
        
        <div class="form-group">
            <label>Webhook URL</label>
            <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
        </div>

        <div class="row">
            <div class="form-group">
                <label>Bot Username (optional)</label>
                <input type="text" id="username" placeholder="Bot Spammers">
            </div>
            <div class="form-group">
                <label>Bot Avatar (optional)</label>
                <div class="media-box">
                    <input type="text" id="avatarUrl" placeholder="Paste image link here...">
                    <div class="file-row">
                        <label for="avatarFile" class="file-btn">Choose File</label>
                        <input type="file" id="avatarFile" accept="image/*,.gif" onchange="handleFileSelect('avatarFile', 'avatarFileName', 'avatarUrl')">
                        <span id="avatarFileName" class="file-name">No file selected</span>
                        <button type="button" class="clear-file-btn" onclick="clearFile('avatarFile', 'avatarFileName')">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-title">Content & GIF Details</div>

        <div class="form-group">
            <label>Message Content (optional)</label>
            <input type="text" id="content" placeholder="Type message or GIF link here...">
        </div>

        <div class="form-group">
            <label>Embed Title (optional)</label>
            <input type="text" id="embedTitle" placeholder="Announcement Title">
        </div>

        <div class="form-group">
            <label>Embed Description (optional)</label>
            <textarea id="embedDesc" placeholder="Write your embed description here..."></textarea>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Embed Color</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="embedColorPicker" value="#dc2626" oninput="syncColor('picker')">
                    <input type="text" id="embedColorHex" class="color-hex-text" value="#dc2626" maxlength="7" oninput="syncColor('text')">
                </div>
            </div>
            <div class="form-group">
                <label>Embed Image or GIF (optional)</label>
                <div class="media-box">
                    <input type="text" id="embedImage" placeholder="Paste image or GIF link here...">
                    <div class="file-row">
                        <label for="embedFile" class="file-btn">Choose File</label>
                        <input type="file" id="embedFile" accept="image/*,.gif" onchange="handleFileSelect('embedFile', 'embedFileName', 'embedImage')">
                        <span id="embedFileName" class="file-name">No file selected</span>
                        <button type="button" class="clear-file-btn" onclick="clearFile('embedFile', 'embedFileName')">Clear</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="section-title">Spam Settings</div>

        <div class="row">
            <div class="form-group">
                <label>Loop Count</label>
                <input type="number" id="loopCount" value="1" min="1" max="100">
            </div>
            <div class="form-group">
                <label>Delay Seconds</label>
                <input type="number" id="delayTime" value="1" min="1" max="60">
            </div>
        </div>

        <button class="send-btn" id="sendBtn" onclick="sendWebhook()">Send Message</button>
    </div>

    <script>
        function handleFileSelect(inputId, labelId, urlInputId) {
            const input = document.getElementById(inputId);
            const label = document.getElementById(labelId);
            if (input.files && input.files[0]) {
                label.textContent = input.files[0].name;
                document.getElementById(urlInputId).value = '';
            } else {
                label.textContent = 'No file selected';
            }
        }

        function clearFile(inputId, labelId) {
            const input = document.getElementById(inputId);
            const label = document.getElementById(labelId);
            input.value = '';
            label.textContent = 'No file selected';
        }

        function syncColor(source) {
            const picker = document.getElementById('embedColorPicker');
            const hexInput = document.getElementById('embedColorHex');
            if (source === 'picker') {
                hexInput.value = picker.value;
            } else {
                let val = hexInput.value.trim();
                if (!val.startsWith('#')) val = '#' + val;
                if (/^#[0-9A-Fa-f]{6}$/.test(val)) picker.value = val;
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'error' ? '❌' : (type === 'warning' ? '⚠️' : '✅');
            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function hexToDecimal(hex) {
            let cleanHex = hex.replace("#", "").trim();
            if (cleanHex.length !== 6) cleanHex = "dc2626";
            return parseInt(cleanHex, 16);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function sendWebhook() {
            const webhookUrl = document.getElementById('webhookUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const avatarUrl = document.getElementById('avatarUrl').value.trim();
            const avatarFileInput = document.getElementById('avatarFile');
            const avatarFile = avatarFileInput.files && avatarFileInput.files[0] ? avatarFileInput.files[0] : null;

            const content = document.getElementById('content').value.trim();
            const embedTitle = document.getElementById('embedTitle').value.trim();
            const embedDesc = document.getElementById('embedDesc').value.trim();
            const hexColor = document.getElementById('embedColorHex').value;
            const embedImageUrl = document.getElementById('embedImage').value.trim();
            const embedFileInput = document.getElementById('embedFile');
            const embedFile = embedFileInput.files && embedFileInput.files[0] ? embedFileInput.files[0] : null;

            const loopCount = parseInt(document.getElementById('loopCount').value) || 1;
            const delayTime = (parseInt(document.getElementById('delayTime').value) || 1) * 1000;
            const sendBtn = document.getElementById('sendBtn');

            if (!webhookUrl) {
                showToast('Webhook URL is required!', 'error');
                return;
            }

            if (!content && !embedTitle && !embedDesc && !embedImageUrl && !embedFile) {
                showToast('Please fill at least one content, embed, or file field!', 'warning');
                return;
            }

            let resolvedAvatarUrl = avatarUrl;
            if (!resolvedAvatarUrl && avatarFile) {
                try {
                    resolvedAvatarUrl = await fileToBase64(avatarFile);
                } catch (e) {
                    showToast('Failed to read avatar file.', 'error');
                    return;
                }
            }

            const payload = {};
            if (username) payload.username = username;
            if (resolvedAvatarUrl) payload.avatar_url = resolvedAvatarUrl;
            if (content) payload.content = content;

            if (embedTitle || embedDesc || embedImageUrl || embedFile) {
                const embed = {};
                if (embedTitle) embed.title = embedTitle;
                if (embedDesc) embed.description = embedDesc;
                embed.color = hexToDecimal(hexColor);
                if (embedFile) {
                    embed.image = { url: `attachment://${embedFile.name}` };
                } else if (embedImageUrl) {
                    embed.image = { url: embedImageUrl };
                }
                payload.embeds = [embed];
            }

            sendBtn.disabled = true;
            showToast(`Starting delivery (0/${loopCount})...`, 'warning');

            let successCount = 0;
            for (let i = 1; i <= loopCount; i++) {
                try {
                    let response;

                    if (embedFile) {
                        const formData = new FormData();
                        formData.append('payload_json', JSON.stringify(payload));
                        formData.append('files[0]', embedFile, embedFile.name);

                        response = await fetch(webhookUrl, {
                            method: 'POST',
                            body: formData
                        });
                    } else {
                        response = await fetch(webhookUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    }

                    if (response.status === 429) {
                        showToast(`Hit Discord Rate Limit! Stopped at message #${i}.`, 'error');
                        break;
                    }

                    if (!response.ok && response.status !== 204) {
                        throw new Error(`HTTP Error: ${response.status}`);
                    }

                    successCount++;
                    if (i < loopCount) {
                        await new Promise(resolve => setTimeout(resolve, delayTime));
                    }
                } catch (error) {
                    showToast(`Failed to send: ${error.message}`, 'error');
                    break;
                }
            }

            if (successCount > 0) {
                showToast(`Successfully sent ${successCount} message(s)!`, 'success');
            }
            sendBtn.disabled = false;
        }
    </script>
</body>
</html>
