<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Troll Tools - By Strike Dev</title>
    <style>
        :root {
            --bg-dark: #0f0505;
            --bg-card: #1c0a0a;
            --bg-panel: #170707;
            --primary-red: #990000;
            --bright-red: #d90429;
            --border-red: #4a0e0e;
            --text-main: #f8f9fa;
            --text-muted: #b8a8a8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
        }

        .hidden {
            display: none !important;
        }

        /* Header Section */
        header {
            background: linear-gradient(180deg, #2b0606 0%, var(--bg-dark) 100%);
            border-bottom: 1px solid var(--border-red);
            padding: 2.5rem 1rem 2rem;
            text-align: center;
        }

        .admin-bar {
            max-width: 960px;
            margin: 0 auto 1.2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-status {
            font-size: 0.85rem;
            color: #ff8585;
            background: rgba(153, 0, 0, 0.25);
            border: 1px solid var(--border-red);
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
        }

        .btn-outline-red {
            background: transparent;
            color: #ff6b6b;
            border: 1px solid var(--bright-red);
            padding: 0.45rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-outline-red:hover {
            background: var(--bright-red);
            color: #fff;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--bright-red);
            box-shadow: 0 0 22px rgba(217, 4, 41, 0.55);
            transition: transform 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.05);
        }

        header h1 {
            font-size: 2.35rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(217, 4, 41, 0.65);
            margin-top: 0.6rem;
        }

        header p.subtitle {
            font-size: 1rem;
            color: var(--bright-red);
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 0.2rem;
        }

        /* Modal Login Melayang di Tengah */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            z-index: 999;
        }

        .modal-box {
            width: 100%;
            max-width: 420px;
            background-color: #190707;
            border: 1px solid var(--bright-red);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 12px 35px rgba(217, 4, 41, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.04);
            animation: popIn 0.18s ease-out;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Main Container */
        .container {
            max-width: 960px;
            margin: 2rem auto 4rem;
            padding: 0 1.2rem;
        }

        /* Admin Panel Card */
        .panel-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-red);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-red);
            padding-bottom: 0.7rem;
            margin-bottom: 1.2rem;
        }

        .panel-header h2 {
            font-size: 1.2rem;
            color: #ff5959;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background-color: #100303;
            border: 1px solid var(--border-red);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--bright-red);
        }

        .btn-primary {
            background-color: var(--primary-red);
            color: #fff;
            border: none;
            padding: 0.8rem 1.4rem;
            font-size: 0.98rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: var(--bright-red);
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        .btn-secondary {
            background-color: #2b1010;
            color: #e0d0d0;
            border: 1px solid var(--border-red);
            padding: 0.55rem 0.95rem;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background-color: #3d1616;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-actions .btn-primary {
            flex: 1;
            width: auto;
        }

        /* Section Title */
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 24px;
            background-color: var(--bright-red);
            border-radius: 4px;
        }

        /* Posts Grid */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .post-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-red);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 22px rgba(217, 4, 41, 0.22);
            border-color: var(--bright-red);
        }

        .post-image {
            width: 100%;
            height: 165px;
            object-fit: cover;
            background-color: #260909;
            border-bottom: 1px solid var(--border-red);
        }

        .post-content {
            padding: 1.2rem;
            flex-grow: 1;
        }

        .post-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .post-desc {
            font-size: 0.92rem;
            color: var(--text-muted);
            word-wrap: break-word;
            white-space: pre-line;
        }

        .post-footer {
            padding: 0 1.2rem 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-go {
            display: block;
            text-align: center;
            background-color: var(--primary-red);
            border: 1px solid var(--bright-red);
            color: #ffffff;
            text-decoration: none;
            padding: 0.65rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.92rem;
            transition: all 0.2s;
        }

        .btn-go:hover {
            background-color: var(--bright-red);
        }

        .admin-card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            flex: 1;
            background-color: #2c1414;
            color: #ffd166;
            border: 1px solid #7a4b12;
            padding: 0.45rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-edit:hover {
            background-color: #421e1e;
        }

        .btn-delete {
            background-color: #2b0707;
            color: #ff6b6b;
            border: 1px solid #801313;
            padding: 0.45rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-delete:hover {
            background-color: #801313;
            color: #fff;
        }

        .loading-text {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="admin-bar">
            <span id="adminBadge" class="admin-status hidden">Mode Admin Aktif</span>
            <button id="toggleLoginBtn" class="btn-outline-red">Admin Login</button>
            <button id="logoutBtn" class="btn-outline-red hidden">Logout</button>
        </div>

        <a href="https://ibb.co.com/TBdXpZSp" target="_blank" rel="noopener noreferrer">
            <img src="https://i.ibb.co.com/RpdnZ1mZ/icon.jpg" alt="Strike Dev Icon" class="profile-img">
        </a>
        <h1>All Troll Tools</h1>
        <p class="subtitle">By Strike Dev</p>
    </header>

    <!-- Popup Login Admin Melayang di Tengah -->
    <div id="loginSection" class="modal-backdrop hidden">
        <div class="modal-box">
            <div class="panel-header">
                <h2>Login Admin</h2>
                <button type="button" id="closeLoginBtn" class="btn-secondary">Tutup</button>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Admin</label>
                    <input type="email" id="adminEmail" placeholder="admin@example.com" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="Masukkan password admin" required>
                </div>
                <button type="submit" class="btn-primary" id="loginSubmitBtn">Masuk ke Admin Panel</button>
            </form>
        </div>
    </div>

    <div class="container">
        <!-- Admin Panel: Buat & Edit Post -->
        <div id="adminPanel" class="panel-card hidden">
            <div class="panel-header">
                <h2 id="panelTitle">Admin Panel — Buat Post Baru</h2>
            </div>
            <form id="postForm">
                <input type="hidden" id="editingPostId">

                <div class="form-group">
                    <label for="title">Title Post (Nama Website / Tool) *</label>
                    <input type="text" id="title" placeholder="Contoh: Fake Windows BSOD" required>
                </div>

                <div class="form-group">
                    <label for="description">Description Post *</label>
                    <textarea id="description" rows="3" placeholder="Tulis deskripsi singkat tentang website ini..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="targetUrl">Tujuan Tombol "Go To Website" (URL) *</label>
                    <input type="url" id="targetUrl" placeholder="https://website-tujuan-kamu.com" required>
                </div>

                <div class="form-group">
                    <label for="imageUrl">Link Thumbnail / Gambar (Opsional)</label>
                    <input type="url" id="imageUrl" placeholder="https://i.ibb.co.com/... (Kosongkan untuk pakai foto profil)">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="savePostBtn">Publish Post</button>
                    <button type="button" class="btn-secondary hidden" id="cancelEditBtn">Batal Edit</button>
                </div>
            </form>
        </div>

        <!-- Daftar Post Publik -->
        <h3 class="section-title">Semua Post Website</h3>
        <div class="posts-grid" id="postsContainer">
            <p class="loading-text">Memuat semua post...</p>
        </div>
    </div>

    <!-- Firebase Modular SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            addDoc,
            updateDoc,
            deleteDoc,
            doc,
            onSnapshot,
            query,
            orderBy,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Konfigurasi Firebase Project: troll-server
        const firebaseConfig = {
            apiKey: "AIzaSyA6iR9hwGwGtRjyb3JG14Ug4Xe_HAVgZUE",
            authDomain: "troll-server.firebaseapp.com",
            projectId: "troll-server",
            storageBucket: "troll-server.firebasestorage.app",
            messagingSenderId: "388914139525",
            appId: "1:388914139525:web:315b23ef71ac76a58534ec"
        };

        const DEFAULT_AVATAR = "https://i.ibb.co.com/RpdnZ1mZ/icon.jpg";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const postsCollection = collection(db, "troll_tools_posts");

        const toggleLoginBtn = document.getElementById("toggleLoginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const closeLoginBtn = document.getElementById("closeLoginBtn");
        const adminBadge = document.getElementById("adminBadge");
        const loginSection = document.getElementById("loginSection");
        const loginForm = document.getElementById("loginForm");
        const loginSubmitBtn = document.getElementById("loginSubmitBtn");

        const adminPanel = document.getElementById("adminPanel");
        const panelTitle = document.getElementById("panelTitle");
        const postForm = document.getElementById("postForm");
        const editingPostIdInput = document.getElementById("editingPostId");
        const titleInput = document.getElementById("title");
        const descriptionInput = document.getElementById("description");
        const targetUrlInput = document.getElementById("targetUrl");
        const imageUrlInput = document.getElementById("imageUrl");
        const savePostBtn = document.getElementById("savePostBtn");
        const cancelEditBtn = document.getElementById("cancelEditBtn");

        const postsContainer = document.getElementById("postsContainer");

        let isAdmin = false;
        let latestPostsDocs = [];

        toggleLoginBtn.addEventListener("click", () => {
            loginSection.classList.remove("hidden");
        });

        closeLoginBtn.addEventListener("click", () => {
            loginSection.classList.add("hidden");
        });

        loginSection.addEventListener("click", (e) => {
            if (e.target === loginSection) {
                loginSection.classList.add("hidden");
            }
        });

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("adminEmail").value.trim();
            const password = document.getElementById("adminPassword").value;

            loginSubmitBtn.disabled = true;
            loginSubmitBtn.textContent = "Memverifikasi...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginForm.reset();
                loginSection.classList.add("hidden");
            } catch (error) {
                console.error("Login gagal:", error);
                alert("Login gagal! Periksa kembali email dan password admin.");
            } finally {
                loginSubmitBtn.disabled = false;
                loginSubmitBtn.textContent = "Masuk ke Admin Panel";
            }
        });

        logoutBtn.addEventListener("click", async () => {
            try {
                resetFormMode();
                await signOut(auth);
            } catch (error) {
                console.error("Logout gagal:", error);
            }
        });

        onAuthStateChanged(auth, (user) => {
            isAdmin = Boolean(user);

            if (isAdmin) {
                adminBadge.classList.remove("hidden");
                adminPanel.classList.remove("hidden");
                logoutBtn.classList.remove("hidden");
                toggleLoginBtn.classList.add("hidden");
                loginSection.classList.add("hidden");
            } else {
                adminBadge.classList.add("hidden");
                adminPanel.classList.add("hidden");
                logoutBtn.classList.add("hidden");
                toggleLoginBtn.classList.remove("hidden");
                resetFormMode();
            }

            renderPosts(latestPostsDocs);
        });

        function resetFormMode() {
            editingPostIdInput.value = "";
            postForm.reset();
            panelTitle.textContent = "Admin Panel — Buat Post Baru";
            savePostBtn.textContent = "Publish Post";
            cancelEditBtn.classList.add("hidden");
        }

        cancelEditBtn.addEventListener("click", resetFormMode);

        function startEditPost(postId, data) {
            if (!isAdmin) return;
            adminPanel.classList.remove("hidden");
            editingPostIdInput.value = postId;
            titleInput.value = data.title || "";
            descriptionInput.value = data.description || "";
            targetUrlInput.value = data.url || "";
            imageUrlInput.value = data.image && data.image !== DEFAULT_AVATAR ? data.image : "";

            panelTitle.textContent = "Admin Panel — Edit Post";
            savePostBtn.textContent = "Simpan Perubahan";
            cancelEditBtn.classList.remove("hidden");
            adminPanel.scrollIntoView({ behavior: "smooth" });
        }

        async function handleDeletePost(postId, title) {
            if (!isAdmin) return;
            const yakin = confirm(`Hapus post "${title}"?`);
            if (!yakin) return;

            try {
                await deleteDoc(doc(db, "troll_tools_posts", postId));
                if (editingPostIdInput.value === postId) {
                    resetFormMode();
                }
            } catch (error) {
                console.error("Gagal menghapus post:", error);
                alert("Gagal menghapus post.");
            }
        }

        postForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (!isAdmin) {
                alert("Hanya admin yang bisa membuat atau mengedit post!");
                return;
            }

            const editingId = editingPostIdInput.value.trim();
            const payload = {
                title: titleInput.value.trim(),
                description: descriptionInput.value.trim(),
                url: targetUrlInput.value.trim(),
                image: imageUrlInput.value.trim() || DEFAULT_AVATAR
            };

            savePostBtn.disabled = true;
            savePostBtn.textContent = "Menyimpan...";

            try {
                if (editingId) {
                    await updateDoc(doc(db, "troll_tools_posts", editingId), {
                        ...payload,
                        updatedAt: serverTimestamp()
                    });
                    alert("Post berhasil diperbarui!");
                } else {
                    await addDoc(postsCollection, {
                        ...payload,
                        createdAt: serverTimestamp()
                    });
                    alert("Post baru berhasil dipublikasikan!");
                }
                resetFormMode();
            } catch (error) {
                console.error("Gagal menyimpan post:", error);
                alert("Terjadi kesalahan saat menyimpan post.");
            } finally {
                savePostBtn.disabled = false;
                savePostBtn.textContent = editingPostIdInput.value ? "Simpan Perubahan" : "Publish Post";
            }
        });

        function renderPosts(docsList) {
            postsContainer.innerHTML = "";

            if (!docsList || docsList.length === 0) {
                postsContainer.innerHTML = '<p class="loading-text">Belum ada post website yang tersedia.</p>';
                return;
            }

            docsList.forEach((item) => {
                const postId = item.id;
                const data = item.data;

                const card = document.createElement("div");
                card.className = "post-card";

                const img = document.createElement("img");
                img.className = "post-image";
                img.src = data.image || DEFAULT_AVATAR;
                img.alt = data.title || "Post thumbnail";
                img.onerror = function () {
                    this.src = DEFAULT_AVATAR;
                };

                const content = document.createElement("div");
                content.className = "post-content";

                const titleEl = document.createElement("h4");
                titleEl.className = "post-title";
                titleEl.textContent = data.title || "Tanpa Judul";

                const descEl = document.createElement("p");
                descEl.className = "post-desc";
                descEl.textContent = data.description || "";

                content.appendChild(titleEl);
                content.appendChild(descEl);

                const footer = document.createElement("div");
                footer.className = "post-footer";

                const goBtn = document.createElement("a");
                goBtn.className = "btn-go";
                goBtn.href = data.url || "#";
                goBtn.target = "_blank";
                goBtn.rel = "noopener noreferrer";
                goBtn.textContent = "Go To Website";

                footer.appendChild(goBtn);

                if (isAdmin) {
                    const adminActions = document.createElement("div");
                    adminActions.className = "admin-card-actions";

                    const editBtn = document.createElement("button");
                    editBtn.type = "button";
                    editBtn.className = "btn-edit";
                    editBtn.textContent = "Edit";
                    editBtn.addEventListener("click", () => startEditPost(postId, data));

                    const delBtn = document.createElement("button");
                    delBtn.type = "button";
                    delBtn.className = "btn-delete";
                    delBtn.textContent = "Hapus";
                    delBtn.addEventListener("click", () => handleDeletePost(postId, data.title));

                    adminActions.appendChild(editBtn);
                    adminActions.appendChild(delBtn);
                    footer.appendChild(adminActions);
                }

                card.appendChild(img);
                card.appendChild(content);
                card.appendChild(footer);

                postsContainer.appendChild(card);
            });
        }

        const q = query(postsCollection, orderBy("createdAt", "desc"));
        onSnapshot(
            q,
            (snapshot) => {
                latestPostsDocs = snapshot.docs.map((d) => ({
                    id: d.id,
                    data: d.data()
                }));
                renderPosts(latestPostsDocs);
            },
            (error) => {
                console.error("Error mengambil data Firestore:", error);
                postsContainer.innerHTML =
                    '<p class="loading-text" style="color:#ff6b6b;">Gagal memuat data. Periksa konfigurasi Firebase & Firestore Rules.</p>';
            }
        );
    </script>
</body>
</html>
